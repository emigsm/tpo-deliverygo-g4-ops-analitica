#app name y puerto de salida
spring.application.name=deliverygo-ops-analitica
server.port=8089

# h2 base en memoria sin persistencia
spring.datasource.url=jdbc:h2:mem:deliverygo-ops-analitica
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# create-drop: Hibernate crea el esquema al arrancar y lo borra al apagar (ver DemoDataLoader).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Consola H2 para inspección local en /h2-console. No apta para producción.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Ruta de Swagger UI (el contrato OpenAPI se expone en /v3/api-docs).
springdoc.swagger-ui.path=/swagger-ui.html

# DM-19: JWT emitido por el módulo Usuarios (HS256, clave compartida)
# Este módulo solo valida tokens. Debe ser la misma clave que usa Usuarios (variable JWT_SECRET), de al menos 32 caracteres.
# El valor por defecto es solo para demo y tests locales.
jwt.secret=${JWT_SECRET:DeliveryGo-Ops-Secret-Key-Demo-2026-Must-Be-Long-Enough}

# API-05: clave X-Api-Key de cada módulo emisor de eventos (mínimo 16 caracteres)
# Los valores por defecto son solo para demo. Para prod, sobrescribir con variables de entorno.
eventos.api-key.pedidos=${EVENTOS_API_KEY_PEDIDOS:clave-demo-pedidos-2026}
eventos.api-key.pagos=${EVENTOS_API_KEY_PAGOS:clave-demo-pagos-2026}
eventos.api-key.logistica=${EVENTOS_API_KEY_LOGISTICA:clave-demo-logistica-2026}

# CU-05, INT-05: estadísticas simuladas para cualquier período solicitado.
# Estas opciones no afectan obtenerPedido ni CU-01 a CU-04.
app.pedidos.mock.stats.disponible=true
app.pedidos.mock.stats.cantidad-entregados=2

# Exportar el contrato implementado como OpenAPI 3.1.
# Las integraciones HTTP (solo se usan con el perfil "integracion")
# Se pueden sobrescribir con variables de entorno o por línea de comandos.
integraciones.comercios.url=${INTEGRACIONES_COMERCIOS_URL:http://localhost:8081}
integraciones.usuarios.url=${INTEGRACIONES_USUARIOS_URL:http://localhost:8082}
# La API key debe tener al menos 16 caracteres (la exige el contrato de Usuarios, header X-Api-Key).
integraciones.usuarios.api-key=${INTEGRACIONES_USUARIOS_API_KEY:cambiar-esta-clave-demo}
springdoc.api-docs.version=OPENAPI_3_1

# DM-19: ya no se usa HTTP Basic. Se desactiva el usuario "user" con contraseña aleatoria que Spring Boot creaba por defecto.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
