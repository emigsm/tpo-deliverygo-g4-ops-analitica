spring.application.name=deliverygo-ops-analitica
server.port=8089
spring.datasource.url=jdbc:h2:mem:deliverygo-ops-analitica
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html
#app.jwt.secret=DeliveryGo-Ops-Secret-Key-Demo-2026-Must-Be-Long-Enough
#app.jwt.expiration-minutes=60

# CU-05 / INT-05 propuesto: estadísticas simuladas para cualquier período solicitado.
# Estas opciones no afectan obtenerPedido ni CU-01 a CU-04.
app.pedidos.mock.stats.disponible=true
app.pedidos.mock.stats.cantidad-entregados=2

# Exportar el contrato implementado como OpenAPI 3.1.
springdoc.api-docs.version=OPENAPI_3_1
