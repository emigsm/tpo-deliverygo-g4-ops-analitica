openapi: 3.1.0
info:
  title: DeliveryGo — Evolución propuesta (NO IMPLEMENTADA)
  version: propuesta-1.3
  description: 'API-05/CU-06/RN-09/DTO-11 y DTO-12; API-06/CU-07/DTO-10. Fuentes:
    TPO v1.2, evolución y documento de endpoints. No registrada en Spring MVC ni Swagger.
    DM-18: CU-08/09/10 ampliarán API-04 sin nuevos endpoints. Pendientes: idempotencia/duplicados,
    autenticación servicio-a-servicio, identificadores y formatos, zona/semántica
    temporal, validación origen/tipo y semántica de filtrado de snapshots. No se declara
    security: autenticación por acordar, no acceso anónimo confirmado.'
paths:
  /api/v1/analytics/events:
    post:
      operationId: propuestoRegistrarEvento
      summary: Registrar evento analítico
      description: |
        CU-06, RN-09: registra eventos operativos enviados por otros módulos de DeliveryGo para su posterior procesamiento analítico.

        Admite cambios de estado de pedidos, pagos aprobados, pagos rechazados y entregas completadas.

        Los campos tipoEvento, moduloOrigen, entidadId y fechaEvento son obligatorios. Para cambios de estado de pedidos, detalle identifica el nuevo estado. Para entregas completadas, valor representa la duración en minutos.

        Los eventos registrados permiten calcular métricas operativas que posteriormente se consultan mediante API-06 y API-04.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoAnaliticoRequest'
      responses:
        '201':
          description: 'Propuesto: evento registrado (DTO-12).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoAnaliticoResponse'
        '409':
          description: 'Solo propuesto: pendiente del acuerdo de idempotencia y deteccion de duplicados; no garantizado.'
        '400': &id001
          description: 'Propuesto: entrada inválida. No representa un endpoint implementado.'
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponseDTO
  /api/v1/analytics/metrics:
    get:
      operationId: propuestoConsultarMetricas
      summary: Consultar métricas por período
      description: |
        CU-07: consulta las métricas analíticas previamente calculadas y almacenadas por el módulo Opiniones y Analítica para el período solicitado.

        Requiere periodoDesde y periodoHasta en formato ISO-8601 (yyyy-MM-dd).

        Devuelve una lista de MetricaResumen (DTO-10), con fuente, tipo de métrica, período y valor.

        No requiere llamadas a otros módulos durante la consulta y no recalcula métricas en tiempo real.

        Cuando no existen métricas para el período, devuelve una lista vacía.
      parameters:
      - name: periodoDesde
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha ISO-8601 obligatoria (yyyy-MM-dd).
      - name: periodoHasta
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Fecha ISO-8601 obligatoria (yyyy-MM-dd).
      responses:
        '200':
          description: Lista de MetricaResumen (DTO-10).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricaResumen'
              examples:
                sinSnapshots:
                  value: []
        '400': *id001
  /api/v1/analytics/dashboard:
    get:
      operationId: propuestoConsultarTablero
      summary: Consultar tablero de métricas operativas
      description: |
        CU-05, CU-08, CU-09 y CU-10; RN-03 y RN-06: obtiene un tablero consolidado de métricas operativas para el período solicitado.

        Incluye cantidad de reseñas, promedio de calificación, pedidos entregados y cancelados, pagos aprobados y rechazados, entregas completadas y tiempo promedio de entrega.

        Las fechas son opcionales; cuando se omiten se utiliza la fecha actual del servidor. Ambos extremos son inclusivos.

        Combina información de reseñas propias, estadísticas externas de Pedidos y eventos analíticos registrados mediante API-05.

        Los resultados se almacenan como snapshots. Cuando una fuente externa no está disponible, puede utilizarse un respaldo válido del período correspondiente, indicado mediante parcial=true.
      parameters:
      - name: periodoDesde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: periodoHasta
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: DTO-04 ampliado propuesto; no implementado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  generadoEn:
                    $ref: ./openapi.yaml#/components/schemas/DashboardResponse/properties/generadoEn
                  parcial:
                    type: boolean
                  metricas:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetricaResumen'
components:
  schemas:
    EventoAnaliticoRequest:
      type: object
      required:
      - tipoEvento
      - moduloOrigen
      - entidadId
      - fechaEvento
      properties:
        tipoEvento:
          type: string
          enum:
          - PEDIDO_ESTADO_CAMBIADO
          - PAGO_APROBADO
          - PAGO_RECHAZADO
          - ENTREGA_COMPLETADA
        moduloOrigen:
          type: string
          enum:
          - PEDIDOS
          - PAGOS
          - LOGISTICA
          description: DM-15. Validación de correspondencia con tipoEvento pendiente.
        entidadId:
          type: integer
          format: int64
          description: Long provisional del documento de endpoints; UUID/Long y formato
            definitivo pendientes. Pedido, pago o entrega según evento.
        valor:
          type:
          - number
          - 'null'
          description: 'Requerido y no nulo para ENTREGA_COMPLETADA: duración en minutos.
            No se requiere para pagos; no se usa en cambios de estado.'
        detalle:
          type:
          - string
          - 'null'
          description: 'Requerido y no nulo para PEDIDO_ESTADO_CAMBIADO: nuevo estado,
            por ejemplo CANCELADO. No se requiere para pagos ni se usa para entregas.'
        fechaEvento:
          type: string
          format: local-date-time
          description: LocalDateTime provisional del documento fuente. Zona, offset
            y semántica temporal pendientes.
      allOf:
      - if:
          properties:
            tipoEvento:
              const: PEDIDO_ESTADO_CAMBIADO
        then:
          required:
          - detalle
          properties:
            detalle:
              type: string
      - if:
          properties:
            tipoEvento:
              const: ENTREGA_COMPLETADA
        then:
          required:
          - valor
          properties:
            valor:
              type: number
    EventoAnaliticoResponse:
      allOf:
      - $ref: '#/components/schemas/EventoAnaliticoRequest'
      - type: object
        required:
        - id
        properties:
          id:
            type: integer
            format: int64
            description: Long provisional; identificador y formato definitivos pendientes.
    MetricaResumen:
      type: object
      description: 'DTO-10 reutilizado conceptualmente. Las primeras tres métricas
        existen; las cinco restantes y las fuentes PAGOS/LOGISTICA son propuestas.
        Sin entregas: tiempo promedio null, persistencia pendiente por NOT NULL actual.'
      properties:
        fuente:
          type: string
          enum:
          - RESENAS
          - PEDIDOS
          - PAGOS
          - LOGISTICA
        tipoMetrica:
          type: string
          enum:
          - PROMEDIO_CALIFICACION
          - CANTIDAD_RESENAS
          - PEDIDOS_ENTREGADOS
          - CANTIDAD_PEDIDOS_CANCELADOS
          - CANTIDAD_PAGOS_APROBADOS
          - CANTIDAD_PAGOS_RECHAZADOS
          - CANTIDAD_ENTREGAS
          - TIEMPO_PROMEDIO_ENTREGA
        periodoDesde:
          $ref: ./openapi.yaml#/components/schemas/MetricaResumen/properties/periodoDesde
        periodoHasta:
          $ref: ./openapi.yaml#/components/schemas/MetricaResumen/properties/periodoHasta
        valor:
          type:
          - number
          - 'null'
          description: Valor agregado; promedio sin observaciones puede ser null según
            el CU. No agrega comportamiento al backend actual.
