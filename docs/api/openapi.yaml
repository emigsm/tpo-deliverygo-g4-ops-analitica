openapi: 3.1.0
info:
  title: DeliveryGo API - Opiniones y Analítica
  description: "API del módulo Opiniones y Analítica. Lo marcado con x-estado: propuesta no está implementado."
  version: "1.0"
servers:
  - url: http://localhost:18092
    description: Entorno local
tags:
  - name: Opiniones
    description: Reseñas, ratings y tablero
  - name: Propuesta analítica
    description: API-05, API-06 y extensión de API-04 (propuesta)
paths:
  /api/v1/reviews:
    post:
      tags:
        - Opiniones
      summary: Crear reseña
      description: "CU-01 y CU-02: registra una reseña de comercio o repartidor para un pedido entregado."
      operationId: crearResena
      security:
        - basicAuth: []
      parameters:
        - name: X-Usuario-Id
          in: header
          description: Id del usuario. Temporal hasta integrar JWT.
          required: true
          schema:
            type: integer
            format: int64
          example: 100
        - name: X-Correlation-Id
          in: header
          description: UUID opcional para trazabilidad de errores.
          required: false
          schema:
            type: string
      requestBody:
        description: Datos de la reseña.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResenaRequest"
        required: true
      responses:
        "201":
          description: Reseña creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResenaResponse"
              examples:
                creada:
                  value:
                    id: 1
                    usuarioId: 100
                    pedidoId: 1
                    tipoObjetivo: COMERCIO
                    objetivoId: 10
                    puntuacion: 5
                    comentario: Buena atención
                    fechaCreacion: 2026-10-30T12:00:00
        "400":
          description: Puntuación inválida (ErrorResponseDTO) o body inválido (Spring Boot)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponseDTO"
                  - $ref: "#/components/schemas/SpringBootError"
              examples:
                negocio:
                  value:
                    timestamp: 2026-10-30T12:00:00Z
                    status: 400
                    code: INVALID_RATING
                    message: La puntuación debe estar entre 1 y 5
                    path: /api/v1/reviews
                    correlationId: 2aa05de5-76a4-46e3-a7a1-e4572cf602a6
        "409":
          description: Reseña duplicada para el pedido y tipo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
              examples:
                negocio:
                  value:
                    timestamp: 2026-10-30T12:00:00Z
                    status: 409
                    code: DUPLICATE_REVIEW
                    message: Ya existe una reseña para ese pedido y tipo
                    path: /api/v1/reviews
                    correlationId: 2aa05de5-76a4-46e3-a7a1-e4572cf602a6
        "422":
          description: Pedido no entregado o ajeno al usuario, o usuario/objetivo inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
              examples:
                negocio:
                  value:
                    timestamp: 2026-10-30T12:00:00Z
                    status: 422
                    code: BUSINESS_RULE_VIOLATION
                    message: El pedido no fue entregado
                    path: /api/v1/reviews
                    correlationId: 2aa05de5-76a4-46e3-a7a1-e4572cf602a6
        "503":
          description: Servicio externo no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
              examples:
                negocio:
                  value:
                    timestamp: 2026-10-30T12:00:00Z
                    status: 503
                    code: EXTERNAL_SERVICE_UNAVAILABLE
                    message: Servicio externo no disponible
                    path: /api/v1/reviews
                    correlationId: 2aa05de5-76a4-46e3-a7a1-e4572cf602a6
        "401":
          description: "Spring Security: no autenticado"
        "403":
          description: "Spring Security: token CSRF inválido"

  /api/v1/merchants/{id}/rating:
    get:
      tags:
        - Opiniones
      summary: Calificación promedio de un comercio
      description: "CU-03: calificación promedio y cantidad de reseñas de un comercio."
      operationId: obtenerRatingComercio
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          description: Id del comercio
          required: true
          schema:
            type: integer
            format: int64
          example: 10
        - name: X-Correlation-Id
          in: header
          description: UUID opcional para trazabilidad de errores.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Sin reseñas, promedio es null y cantidadResenas es 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingResponse"
              examples:
                conResenas:
                  value:
                    objetivoId: 10
                    tipoObjetivo: COMERCIO
                    promedio: 4.75
                    cantidadResenas: 4
                sinResenas:
                  value:
                    objetivoId: 10
                    tipoObjetivo: COMERCIO
                    promedio: null
                    cantidadResenas: 0
        "401":
          description: "Spring Security: no autenticado"

  /api/v1/couriers/{id}/rating:
    get:
      tags:
        - Opiniones
      summary: Calificación promedio de un repartidor
      description: "CU-04: calificación promedio y cantidad de reseñas de un repartidor."
      operationId: obtenerRatingRepartidor
      security:
        - basicAuth: []
      parameters:
        - name: id
          in: path
          description: Id del repartidor
          required: true
          schema:
            type: integer
            format: int64
          example: 20
        - name: X-Correlation-Id
          in: header
          description: UUID opcional para trazabilidad de errores.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Sin reseñas, promedio es null y cantidadResenas es 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingResponse"
              examples:
                conResenas:
                  value:
                    objetivoId: 20
                    tipoObjetivo: REPARTIDOR
                    promedio: 4.75
                    cantidadResenas: 4
                sinResenas:
                  value:
                    objetivoId: 20
                    tipoObjetivo: REPARTIDOR
                    promedio: null
                    cantidadResenas: 0
        "401":
          description: "Spring Security: no autenticado"

  /api/v1/analytics/dashboard:
    get:
      tags:
        - Opiniones
      summary: Consultar tablero de analítica
      description: "CU-05: cantidad de reseñas, promedio de calificación y pedidos entregados del período. Ampliación propuesta para CU-08, CU-09 y CU-10: DashboardResponsePropuesto."
      operationId: obtenerTablero
      security:
        - basicAuth: []
      parameters:
        - name: periodoDesde
          in: query
          description: Inicio inclusivo (yyyy-MM-dd). Por defecto, hoy.
          required: false
          schema:
            type: string
            format: date
          example: 2025-01-01
        - name: periodoHasta
          in: query
          description: Fin inclusivo (yyyy-MM-dd). Por defecto, hoy.
          required: false
          schema:
            type: string
            format: date
          example: 2025-01-31
        - name: X-Correlation-Id
          in: header
          description: UUID opcional para trazabilidad de errores.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tablero generado. parcial=true indica snapshot de respaldo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
              examples:
                completo:
                  value:
                    generadoEn: 2026-10-30T12:00:00
                    metricas:
                      - fuente: RESENAS
                        tipoMetrica: CANTIDAD_RESENAS
                        periodoDesde: 2026-10-01
                        periodoHasta: 2026-10-30
                        valor: 0
                      - fuente: RESENAS
                        tipoMetrica: PROMEDIO_CALIFICACION
                        periodoDesde: 2026-10-01
                        periodoHasta: 2026-10-30
                        valor: null
                      - fuente: PEDIDOS
                        tipoMetrica: PEDIDOS_ENTREGADOS
                        periodoDesde: 2026-10-01
                        periodoHasta: 2026-10-30
                        valor: 2
                    parcial: false
                respaldoPeriodoExacto:
                  value:
                    generadoEn: 2026-10-30T12:00:00
                    metricas:
                      - fuente: RESENAS
                        tipoMetrica: CANTIDAD_RESENAS
                        periodoDesde: 2026-10-01
                        periodoHasta: 2026-10-30
                        valor: 0
                      - fuente: RESENAS
                        tipoMetrica: PROMEDIO_CALIFICACION
                        periodoDesde: 2026-10-01
                        periodoHasta: 2026-10-30
                        valor: null
                      - fuente: PEDIDOS
                        tipoMetrica: PEDIDOS_ENTREGADOS
                        periodoDesde: 2026-10-01
                        periodoHasta: 2026-10-30
                        valor: 2
                    parcial: true
        "400":
          description: Período invertido (ErrorResponseDTO) o fecha mal formada (Spring Boot)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponseDTO"
                  - $ref: "#/components/schemas/SpringBootError"
              examples:
                negocio:
                  value:
                    timestamp: 2026-10-30T12:00:00Z
                    status: 400
                    code: INVALID_PERIOD
                    message: El periodo es invalido
                    path: /api/v1/analytics/dashboard
                    correlationId: 2aa05de5-76a4-46e3-a7a1-e4572cf602a6
                fechaMalFormada:
                  value:
                    timestamp: 2026-10-30T12:00:00Z
                    status: 400
                    error: Bad Request
                    path: /api/v1/analytics/dashboard
        "503":
          description: Pedidos no disponible y sin snapshot válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
              examples:
                negocio:
                  value:
                    timestamp: 2026-10-30T12:00:00Z
                    status: 503
                    code: EXTERNAL_SERVICE_UNAVAILABLE
                    message: Servicio externo no disponible
                    path: /api/v1/analytics/dashboard
                    correlationId: 2aa05de5-76a4-46e3-a7a1-e4572cf602a6
        "401":
          description: "Spring Security: no autenticado"

  /api/v1/analytics/events:
    post:
      x-estado: propuesta
      tags:
        - Propuesta analítica
      operationId: propuestoRegistrarEvento
      summary: Registrar evento analítico
      description: "CU-06 y RN-09: registra eventos operativos de pedidos, pagos y entregas enviados por otros módulos."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventoAnaliticoRequest"
      responses:
        "201":
          description: Evento registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventoAnaliticoResponse"
        "400":
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "409":
          description: Evento duplicado (pendiente de definir)

  /api/v1/analytics/metrics:
    get:
      x-estado: propuesta
      tags:
        - Propuesta analítica
      operationId: propuestoConsultarMetricas
      summary: Consultar métricas por período
      description: "CU-07: consulta las métricas almacenadas para un período. Devuelve lista vacía si no hay datos."
      parameters:
        - name: periodoDesde
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Inicio (yyyy-MM-dd).
        - name: periodoHasta
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Fin (yyyy-MM-dd).
      responses:
        "200":
          description: Lista de métricas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricaResumenPropuesta"
              examples:
                sinSnapshots:
                  value: []
        "400":
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"

components:
  schemas:
    ResenaRequest:
      type: object
      description: Datos para registrar una reseña
      properties:
        pedidoId:
          type: integer
          format: int64
          description: Id del pedido
          example: 501
        tipoObjetivo:
          type: string
          description: Tipo de objetivo
          enum:
            - COMERCIO
            - REPARTIDOR
          example: COMERCIO
        puntuacion:
          type: integer
          format: int32
          description: Puntuación de 1 a 5
          example: 5
          maximum: 5
          minimum: 1
        comentario:
          type: string
          description: Comentario opcional
          example: Entrega rápida y atención cordial

    ResenaResponse:
      type: object
      description: Reseña creada
      properties:
        id:
          type: integer
          format: int64
          example: 9001
        usuarioId:
          type: integer
          format: int64
          example: 100
        pedidoId:
          type: integer
          format: int64
          example: 501
        tipoObjetivo:
          type: string
          enum:
            - COMERCIO
            - REPARTIDOR
          example: COMERCIO
        objetivoId:
          type: integer
          format: int64
          description: Id del comercio o repartidor
          example: 10
        puntuacion:
          type: integer
          format: int32
          example: 5
        comentario:
          type:
            - string
            - "null"
          example: Entrega rápida y atención cordial
        fechaCreacion:
          type: string
          format: local-date-time
          example: 2025-01-31T14:30:00

    ErrorResponseDTO:
      type: object
      description: Error devuelto por el manejador global de excepciones
      properties:
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora UTC
          example: 2026-10-30T12:00:00Z
        status:
          type: integer
          format: int32
          example: 400
        code:
          type: string
          description: Código estable del error
          example: INVALID_RATING
        message:
          type: string
          example: La puntuación debe estar entre 1 y 5
        path:
          type: string
          example: /api/v1/reviews
        correlationId:
          type: string
          format: uuid
      required:
        - code
        - correlationId
        - message
        - path
        - status
        - timestamp

    SpringBootError:
      type: object
      description: Error estándar de Spring Boot
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        path:
          type: string
      required:
        - error
        - path
        - status
        - timestamp

    RatingResponse:
      type: object
      description: Calificación agregada de un comercio o repartidor
      properties:
        objetivoId:
          type: integer
          format: int64
          example: 10
        tipoObjetivo:
          type: string
          enum:
            - COMERCIO
            - REPARTIDOR
          example: COMERCIO
        promedio:
          type:
            - number
            - "null"
          description: Promedio con dos decimales; null sin reseñas
          example: 4.75
        cantidadResenas:
          type: integer
          format: int64
          example: 12

    DashboardResponse:
      type: object
      description: Tablero de analítica de un período
      properties:
        generadoEn:
          type: string
          format: local-date-time
          example: 2025-01-31T14:30:00
        metricas:
          type: array
          items:
            $ref: "#/components/schemas/MetricaResumen"
        parcial:
          type: boolean
          description: Indica uso de snapshot de respaldo
          example: false

    MetricaResumen:
      type: object
      description: Métrica del tablero
      properties:
        fuente:
          type: string
          enum:
            - RESENAS
            - PEDIDOS
          example: RESENAS
        tipoMetrica:
          type: string
          enum:
            - PROMEDIO_CALIFICACION
            - CANTIDAD_RESENAS
            - PEDIDOS_ENTREGADOS
          example: CANTIDAD_RESENAS
        periodoDesde:
          type: string
          format: date
          example: 2025-01-01
        periodoHasta:
          type: string
          format: date
          example: 2025-01-31
        valor:
          type:
            - number
            - "null"
          description: Valor de la métrica; null solo para promedio sin reseñas
          example: 25.0

    EventoAnaliticoRequest:
      x-estado: propuesta
      type: object
      required:
        - tipoEvento
        - moduloOrigen
        - entidadId
        - fechaEvento
      properties:
        tipoEvento:
          type: string
          enum:
            - PEDIDO_ESTADO_CAMBIADO
            - PAGO_APROBADO
            - PAGO_RECHAZADO
            - ENTREGA_COMPLETADA
        moduloOrigen:
          type: string
          enum:
            - PEDIDOS
            - PAGOS
            - LOGISTICA
        entidadId:
          type: integer
          format: int64
          description: Id del pedido, pago o entrega según el evento
        valor:
          type:
            - number
            - "null"
          description: Duración en minutos. Obligatorio en ENTREGA_COMPLETADA.
        detalle:
          type:
            - string
            - "null"
          description: Nuevo estado. Obligatorio en PEDIDO_ESTADO_CAMBIADO.
        fechaEvento:
          type: string
          format: local-date-time
      allOf:
        - if:
            properties:
              tipoEvento:
                const: PEDIDO_ESTADO_CAMBIADO
          then:
            required:
              - detalle
            properties:
              detalle:
                type: string
        - if:
            properties:
              tipoEvento:
                const: ENTREGA_COMPLETADA
          then:
            required:
              - valor
            properties:
              valor:
                type: number

    EventoAnaliticoResponse:
      x-estado: propuesta
      allOf:
        - $ref: "#/components/schemas/EventoAnaliticoRequest"
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64

    MetricaResumenPropuesta:
      x-estado: propuesta
      type: object
      description: Métrica ampliada con nuevos tipos y fuentes
      properties:
        fuente:
          type: string
          enum:
            - RESENAS
            - PEDIDOS
            - PAGOS
            - LOGISTICA
        tipoMetrica:
          type: string
          enum:
            - PROMEDIO_CALIFICACION
            - CANTIDAD_RESENAS
            - PEDIDOS_ENTREGADOS
            - CANTIDAD_PEDIDOS_CANCELADOS
            - CANTIDAD_PAGOS_APROBADOS
            - CANTIDAD_PAGOS_RECHAZADOS
            - CANTIDAD_ENTREGAS
            - TIEMPO_PROMEDIO_ENTREGA
        periodoDesde:
          type: string
          format: date
        periodoHasta:
          type: string
          format: date
        valor:
          type:
            - number
            - "null"

    DashboardResponsePropuesto:
      x-estado: propuesta
      type: object
      description: Tablero ampliado para CU-08, CU-09 y CU-10
      properties:
        generadoEn:
          type: string
          format: local-date-time
        parcial:
          type: boolean
        metricas:
          type: array
          items:
            $ref: "#/components/schemas/MetricaResumenPropuesta"

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic